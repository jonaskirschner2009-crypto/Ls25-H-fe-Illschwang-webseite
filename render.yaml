services:
  - type: web
    name: hoefe-der-illschwang
    runtime: docker
    plan: starter
    disk:
      name: hoefe-daten
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOF_ADMIN_USER
        value: Admin
      - key: HOF_ADMIN_PASSWORD
        value: admin123
      - key: HOF_CORS_ORIGIN
        value: "*"
      - key: HOF_DB_PATH
        value: /var/data/hoefe.db
